# Engineer Agent Configuration
# Location: ~/.local/share/engineer-agent/engineer.yaml
# Run /engineer setup to create this file automatically.

agent:
  branch_prefix: "engineer-agent"
  max_pr_files: 50
  max_issue_age_days: 30             # ignore GitHub issues whose last update is older than this
                                     # many days (keeps a multi-year assigned backlog from flooding
                                     # the queue). 0 or absent = no age limit.
  standup_channel: "C98765432"
  digest_channel: "C98765432"
  cron_interval_minutes: 15

  # Which tickets deliver a DOCUMENT instead of code. A Spike/Decision/research-shaped ticket gets a
  # `## Findings` comment posted on the ticket plus a local archive under
  # ~/.local/share/engineer-agent/investigations/ — no branch, no PR, no QA. Everything else is code
  # work, exactly as before. Detection is a ladder: manual --investigate/--implement flag → Jira
  # issue type → GitHub label → title keyword → default (code work). Full rules, including the
  # title-matching forms, live in references/ticket-kind.md.
  #
  # The three lists REPLACE the shipped defaults per key — they are NOT merged, so you can narrow
  # them, not only extend them (narrowing is what fixes a false positive). Omitting a key keeps the
  # shipped default; an explicitly EMPTY list ([]) DISABLES that tier. Per-project overrides at
  # projects.<slug>.investigation.* replace these the same way.
  investigation:
    # Jira issue type NAMES (not ids), matched case-insensitively as a whole string. This tier is
    # TERMINAL for Jira: a Jira issue always has a type, so a Jira ticket never reaches the title
    # tier below.
    #
    # ⚠ "Task" is shipped ON, and it is the one aggressive default here. In many Jira projects Task
    # is the default catch-all type for ordinary code work, so on such an instance a routine
    # implementation ticket is drafted as an investigation — and if approved unread, gets a findings
    # comment where you expected a PR. The approval gate shows you an "Investigation Plan" that says
    # "no branch, no PR" first, so it is visible; but if your Task means code work, narrow this list
    # (globally here, or per project below) to ["Spike", "Decision"].
    jira_types: ["Spike", "Decision", "Task"]
    # Label names, case-insensitive, compared after stripping a `type:`/`type/`/`kind:`/`kind/`
    # prefix, so `type: spike` and `kind/spike` both match. Whole label, never a substring —
    # otherwise `spike-protection` and `decision-log` would fire too. "question" is NOT shipped: it
    # is used too loosely on GitHub to decide a deliverable.
    github_labels: ["spike", "research", "investigation", "decision", "adr", "rfc", "discovery"]
    # Matched against the TITLE only (never the body), and only in two low-false-positive forms:
    #   1. a delimited prefix   — "Spike: cache invalidation", "[Decision] queue backend"
    #   2. a leading imperative — "Investigate why checkout 500s", "Compare Sidekiq vs SQS"
    # Never as a bare noun mid-title, which is why "Add spike protection to the rate limiter" stays
    # code work. Reachable for GitHub issues only (Jira is decided by issue type). Set to [] to
    # switch the title tier off and trust tracker metadata only.
    title_keywords: ["spike", "decision", "adr", "rfc", "investigate", "research",
                     "evaluate", "compare", "assess", "determine"]

  # Slack access. Optional block — omit it and the agent assumes method "spy" with `spy` on
  # PATH and a single signed-in workspace. Two backends, selected by `method`:
  #
  #   method: spy        (default) — the Spy CLI (https://github.com/tomharris/spy). No
  #                      OAuth/app install; spy reuses your local Slack desktop session. Sign
  #                      in to Slack desktop, then run `spy auth` to confirm. Best for a
  #                      single, non-Enterprise-Grid workspace.
  #
  #   method: mcp-proxy  — for Slack ENTERPRISE GRID, where spy's browser-token scraping is
  #                      broken and unsafe (the first automated call force-logs you out;
  #                      tokens rotate hourly). This backend uses scripts/slack-mcp.sh, which
  #                      reads Claude Code's existing OAuth token from your macOS login
  #                      Keychain (read-only) and talks to Anthropic's MCP proxy fronting the
  #                      official Slack connector. No browser tokens, zero model-token cost.
  #                      Requires curl + jq. Depends on the login keychain being unlocked, so
  #                      the headless poll must run in your GUI login session (the LaunchAgent
  #                      installed by scripts/install-cron.sh already does — see CLAUDE.md).
  slack:
    method: "spy"         # "spy" (default) | "mcp-proxy" (Slack Enterprise Grid)
    bin: "spy"            # path to the spy binary — only used when method: spy (default "spy")
    workspace: "myco"     # default Slack workspace (team domain or team_id) — required when
                          # multiple workspaces are signed in (spy). Per-project override below.
    user_name: ""         # your Slack display name — ONLY used by the scripted Slack collector
    user_id: ""           # your Slack user id (U…) — ONLY used by the scripted Slack collector.
                          # Both feed the "is this question aimed at me?" judgment, and user_id
                          # also drops your own messages before any judgment is paid for. Optional;
                          # without them the judgment leans on `keywords` alone and is weaker.
    mcp:                  # only used when method: mcp-proxy
      server: "https://mcp-proxy.anthropic.com/v1/mcp"   # Anthropic MCP proxy base
      server_id: "REPLACE_ME"   # your authorized Slack connector's id (an mcpsrv_… or a UUID).
                                # Find it via claude.ai → Connectors, or Claude Code's /mcp.
                                # Verify with: scripts/slack-mcp.sh auth

  # Which sources are collected by a DETERMINISTIC SCRIPT instead of by the model.
  #
  # A poll normally starts a model session that reads ~87KB of skill instructions and every raw API
  # response, to do work that is almost entirely string comparison and file writing. Listing a
  # source here hands that job to scripts/poll-<source>.sh, which fetches, filters, deduplicates,
  # routes, classifies and writes the queue file itself. The model is then invoked ONLY to draft
  # responses — and when a poll finds nothing new AND every configured source is scripted, it is
  # not invoked at all. That is the common case: most polls find nothing.
  #
  # Supported: "github-issues", "github" (PR review), "jira", "slite" and "slack".
  #
  # The two GitHub sources shell out to the already-authenticated `gh` CLI and need no extra setup.
  # Jira and Slite have no CLI, so their collectors call the REST APIs directly and require BOTH
  # `agent.jira.*` / `agent.slite.*` below AND an API credential (see those blocks). Missing any of
  # that — or a missing `jq` / `curl` — is a CLEAN SKIP: the collector exits and the model polls
  # that source exactly as it always has. You cannot break polling by listing a source here.
  #
  # ⚠ "slack" IS DOUBLE OPT-IN, and it is the only one. Every other source is filtered by a field
  # comparison (a status, an assignee, a tag); Slack's filter is a judgment — "is this actually a
  # question directed at me?" — which is why it was the last source still forcing a model session on
  # every quiet poll. Listing it here is NOT enough: it also needs an `agent.typesafe` API key
  # (below), because the judgment is made by a System One model that returns probabilities rather
  # than prose. Without that key the collector exits cleanly and Slack stays model-driven.
  # Read the note on the `typesafe` block before enabling it: this is the one poll-path integration
  # that sends your content to a third party.
  #
  # The skip is ALL-OR-NOTHING per run: if any configured source is not scripted, the model still
  # runs. So on a typical config you need every source you actually use listed here before a quiet
  # poll can skip the model entirely.
  #
  # DENY-BY-DEFAULT: omit this block (or leave the list empty) and polling behaves exactly as it
  # always has. Override at runtime with EA_POLL_SCRIPTED_SOURCES (space- or comma-separated).
  poll:
    scripted_sources: []          # e.g. ["github-issues", "github", "jira", "slite"]

  # Jira REST access — ONLY used by the scripted collector (agent.poll.scripted_sources: ["jira"]).
  # Everything else in the plugin reaches Jira through mcp__atlassian__*, which needs none of this.
  # Omit the whole block and Jira polling stays model-driven, exactly as before.
  #
  # ⚠ NEVER put the API token in this file. This document gets pasted into issues when asking for
  # help, and ea-config.sh's normalized dump is designed to be safe to log. The keys below name
  # WHERE the secret is; scripts/lib-secret.sh reads it at use time. Resolution order is
  # env var -> file -> macOS Keychain, and the RECOMMENDED route on macOS is the Keychain:
  #
  #     scripts/setup-credentials.sh jira        # prompts, stores in the login keychain
  #
  # because cron/launchd hand the poll a MINIMAL environment. An `export EA_JIRA_API_TOKEN=...` in
  # your shell profile works in every terminal you test from and is ABSENT in the supervised poll —
  # so the env route resolves by hand and silently yields nothing every 15 minutes forever. (Same
  # class of bug as the missing $USER that once broke every cron poll; see CLAUDE.md.) The poll
  # already runs as a gui-session LaunchAgent, so it can read the login keychain.
  #
  # Mint a token at https://id.atlassian.com/manage-profile/security/api-tokens
  jira:
    site: "yourco.atlassian.net"      # your Jira Cloud host
    email: "me@example.com"           # the Atlassian account the token belongs to
    api_token_env: ""                 # optional: name of an env var holding the token
    api_token_file: ""                # optional: path to a 0600 file containing it (Linux)
    # api_base: "/rest/api/2"         # v2 deliberately: v3 returns descriptions as ADF JSON

  # Slite REST access — ONLY used by the scripted collector (scripted_sources: ["slite"]).
  # Same credential rules as Jira above. Key: https://app.slite.com → Settings → API.
  slite:
    api_key_env: ""                   # optional: name of an env var holding the key
    api_key_file: ""                  # optional: path to a 0600 file containing it
    # api_base: "https://api.slite.com/v1"

  # TypeSafe — ONLY used by the scripted Slack collector (scripted_sources: ["slack"]).
  # Omit the whole block and Slack polling stays model-driven, exactly as before.
  #
  # WHAT IT DOES. Slack is the one source whose "is this work?" test cannot be a field comparison.
  # A keyword match alone is mostly false positives — "deploy" appears in every deploy announcement
  # — so skills/poll-slack/SKILL.md asks the model to "use judgment", and that one sentence is why
  # Slack kept every poll paying for a model session. TypeSafe's System One model answers four
  # narrow yes/no questions about each candidate message and returns a PROBABILITY for each:
  #
  #     is_question · directed_at_user · already_answered · needs_engineer
  #
  # scripts/poll-slack.sh combines them in plain bash against the thresholds below. It generates no
  # prose and makes no decision about what to post — a message it selects still becomes an ordinary
  # queue item that you approve. The four raw probabilities are recorded in the item's frontmatter
  # so you can see WHY it was selected, not just that it was.
  #
  # ⚠ THIS IS THE ONE POLL-PATH INTEGRATION THAT SENDS YOUR CONTENT SOMEWHERE NEW. Slack message
  # and thread text goes to api.typesafe.ai. `gh`, Jira and Slite all talk to systems that already
  # hold the data being sent; this does not. That is the entire reason it is a separate opt-in and
  # not implied by listing "slack" above — decide it deliberately.
  #
  # Same credential rules as Jira/Slite: the keys below name WHERE the secret is, never what it is.
  #     scripts/setup-credentials.sh typesafe     # prompts, stores in the login keychain
  typesafe:
    api_key_env: ""                   # optional: name of an env var holding the key
    api_key_file: ""                  # optional: path to a 0600 file containing it
    # api_base: "https://api.typesafe.ai/v1/systemone"
    # model: "jev-latest"
    #
    # Relevance thresholds. Shipped defaults shown; tune them against YOUR channels rather than
    # trusting these — a busy #general wants min_directed higher, a quiet team channel lower.
    # Raise a min_* or lower max_answered to queue less; do the reverse to queue more.
    slack:
      min_question: 0.60              # it is genuinely a question awaiting an answer
      min_directed: 0.55              # it is aimed at you, not at the channel at large
      max_answered: 0.40              # the thread does NOT already contain the answer
      min_engineer: 0.50              # answering needs codebase / implementation knowledge
    #
    # Ticket kind, Tier 3 Form B — "is the leading word of this GitHub issue title an imperative
    # verb commanding investigation, or a noun naming what the issue is about?" `Investigate why
    # checkout 500s` is the first; `Research service returns 500` is a bug in a service called
    # Research. references/ticket-kind.md says the tie-break out loud ("when you cannot tell, it
    # does not fire"), and bash cannot tell — so without this the question is deferred to the
    # drafting model, and the item is written as a plain `ticket` in the meantime.
    #
    # Turning this on makes the kind FINAL when the item is written. Turning it off changes
    # nothing else: the deferral is the behaviour every install has had.
    #
    # ⚠ SEPARATE OPT-IN, ON PURPOSE. Having a key for `slack` above does NOT enable this — issue
    # titles and labels would otherwise start going to api.typesafe.ai as a side effect of a
    # setting made for a different feature. Only the title, its leading word and the issue's
    # labels are sent; the issue BODY never is. Only a title whose leading word already matches a
    # configured `investigation.title_keywords` entry is ever sent at all, so on a normal repo
    # this is a handful of requests, not one per issue.
    ticket_kind:
      enabled: false                  # deny-by-default; only the exact string `true` enables it
      min_imperative: 0.60            # at/above this, the leading word is treated as a command

  # Autonomy tiers — action types the agent may execute WITHOUT a human approval gate.
  # Only "draft-pr" is supported today: a draft PR merges nothing and requests no review,
  # so it is safe to create automatically (you review it on GitHub and mark it ready).
  # Everything else (Slack posts, PR approve/request-changes, issue creation, non-draft PRs)
  # always requires approval. Leave the list empty to gate everything.
  autonomy:
    auto_execute: ["draft-pr"]

  # Push notifications + remote approval via ntfy (https://ntfy.sh). Optional — omit the
  # whole `notify` block and the agent behaves exactly as before (no pushes).
  #
  # How it works: after a poll, each drafted item is pushed to `topic` with Approve / Reject
  # / Open buttons. Tapping Approve/Reject POSTs a command to `command_topic`; the local
  # approval-listener service (see scripts/install-listener.sh) reads it and executes the
  # action. So you approve work from your phone without opening Claude Code.
  #
  # SECURITY: on public ntfy.sh a topic name is effectively a password — anyone who knows
  # `command_topic` can trigger Slack posts and PR creation. Use long, random topic names,
  # set an `auth_token`, and/or self-host ntfy via `server`. Treat `command_topic` as a secret.
  notify:
    # Push an FYI at the end of EVERY turn of an implement-ticket session — interactive and the
    # confined headless run alike — so a long walk-away implementation tells you when it
    # finished, stalled, paused to ask you something, or died on an API error. Delivered by a
    # Claude Code hook (hooks/hooks.json), not by the model, so it also fires on the turns the
    # model can't report on itself.
    #
    # OFF by default, and deliberately so: an interactive session is many turns (capped at 40
    # per session, then muted), and the headless path already sends its own ✅/⚠️ ack — so
    # enabling this adds a third push per remote approval. Requires the `ntfy` block below.
    # Set EA_TURN_NOTIFY_ENABLED=0 in the listener's environment to disable just the headless leg.
    turn_completions: false
    ntfy:
      server: "https://ntfy.sh"              # self-host for stronger isolation
      topic: "ea-alert-CHANGE-ME-RANDOM"     # outbound alerts — keep the name secret
      command_topic: "ea-cmd-CHANGE-ME-RANDOM"  # button taps return here — TREAT AS A PASSWORD
      auth_token: ""                         # optional ntfy access token (Bearer); recommended

# Each project is registered under a short slug.
# Run /engineer add-project from a project directory to add entries here.
projects:
  my-api:                                # short slug — used in queue items and state
    path: "/home/you/Projects/my-api"    # absolute path to the project root
    tracker: "jira"                      # "jira" | "github-issues" | "none" (default: inferred from config sections)

    # Routing hints — OPTIONAL, and only useful when several engineer-agent projects share one
    # Jira project key or one GitHub repo. With a single watcher the ticket routes to it
    # unambiguously and none of this is consulted.
    #
    # When a ticket can't be resolved by summary prefix, Jira components/labels, or GitHub
    # labels, the poll falls back to these hints before giving up and marking it `_unrouted`:
    # `keywords`/`paths` are matched literally, then `description` is matched semantically.
    # Omit the whole block and that fallback is skipped — routing behaves exactly as it did
    # before hints existed. See references/routing-ladder.md for the full ladder.
    routing:
      description: "Paycycle scheduling, voids, and approval workflows"
      keywords: ["paycycle", "void", "payroll"]   # whole-word match on ticket title + body
      paths: ["app/payroll/**"]                   # matched against file paths named in the ticket
    # Confined headless ticket implementation — OPTIONAL, and ONLY consulted when you approve
    # a `ticket` item remotely (an ntfy Approve tap from your phone). Approving a ticket that
    # way runs the full implement-ticket coding session (branch → iterative implementation → draft PR)
    # unattended, inside a throwaway git worktree of this repo. `allowed_commands` is the
    # allowlist of build/test command prefixes that session may run — each becomes a
    # `Bash(<cmd> *)` permission. Keep it TIGHT: it is the security boundary for code driven
    # off (untrusted) issue text. List only your build/test tools, never a shell or a
    # network/file-mangling command. DENY-BY-DEFAULT: omit this block (or leave it empty) and
    # remote ticket approval is *refused* rather than run unconfined — you'll get a "⚠️ Failed"
    # push telling you to configure it, and you implement the ticket interactively instead.
    # (The interactive terminal path never uses this list — a human is present to approve.)
    exec:
      allowed_commands: ["bin/rails", "bin/rspec", "bin/srb", "bundle"]  # e.g. Rails; adjust per repo
    # Investigation deliverable — OPTIONAL. Overrides agent.investigation.* for this project (per
    # key, REPLACING the list rather than merging), and says what happens to the ticket after the
    # findings comment is posted. Omit the whole block and the global lists apply with no transition.
    # NOTE: an investigation needs NO exec.allowed_commands — it runs no build commands, so the
    # deny-by-default refusal above does not apply to it. A doc-only ticket is never refused for
    # lacking a build list.
    investigation:
      on_complete_status: ""       # optional: Jira status to move the ticket to AFTER a successful
                                   # comment. Best-effort — a failed transition is reported but never
                                   # un-completes the investigation, and the comment is NEVER
                                   # re-posted to retry it. Empty/absent = no transition, and the
                                   # transition MCP verbs are not even added to the confined run's
                                   # allowlist. Jira only; ignored for GitHub Issues.
      # jira_types: ["Spike", "Decision"]     # this project's "Task" means real code work
      # github_labels: ["spike", "question"]
      # title_keywords: []                    # titles here are noisy — trust the tracker only
    github:
      owner: "myorg"
      repos: ["my-api"]
      review_requested_for: "my-username"
      ignore_labels: ["wip", "draft"]
      # issues:                          # only when tracker: github-issues
      #   assignee: "my-username"
      #   labels: []                     # optional: only match issues carrying these labels.
      #                                  # Also routes: when several projects watch this repo,
      #                                  # labels decide which one an issue belongs to. Empty
      #                                  # or absent = catch-all for the repo.
    slack:
      channels: ["C12345678"]
      keywords: ["@myname"]
      ignore_bots: true
      workspace: "myco"                  # optional: overrides agent.slack.workspace for this project
    jira:
      sources:                              # list of Jira projects to watch (N:M mapping supported)
        - project: "ENG"                    # Jira project key (required)
          components: ["api", "backend"]    # optional: only match tickets with these Jira components
          labels: []                        # optional: only match tickets with these Jira labels
        # - project: "PLAT"                 # watch a second Jira project for this repo
        #   labels: ["infra"]
      assignee: "me@example.com"            # shared across all sources
      statuses: ["To Do", "In Progress"]    # shared across all sources
    slite:
      doc_labels: ["needs-review"]
      design_doc_parent: ""              # Slite note ID or channel where design docs are created
      design_doc_template: ""            # Slite note ID of a template doc (optional, uses built-in default if empty)
    qa:
      # Also opt-in for headless QA: when this block has a base_url, a remotely-approved ticket
      # implementation (ntfy) auto-drafts a qa-test-plan for the new branch after the draft PR
      # (best-effort). Omit the block and that step is skipped quietly.
      base_url: "http://localhost:3000"  # base URL for curl commands in QA test scripts
      console_command: ""                # e.g. "rails console", "python manage.py shell", "node" (optional)
      document_to: ""                    # where to document completed QA plans: "slite" | "" (empty/absent disables)
      document_parent: ""                # Slite channel/note id for the QA doc; empty → user's private (personal) channel

  # Example: project using GitHub Issues instead of Jira
  # my-app:
  #   path: "/home/you/Projects/my-app"
  #   tracker: "github-issues"
  #   github:
  #     owner: "myorg"
  #     repos: ["my-app"]
  #     review_requested_for: "my-username"
  #     ignore_labels: ["wip", "draft"]
  #     issues:
  #       assignee: "my-username"
  #       labels: []                     # optional: match/route by label (see my-api above)
  #   slack:
  #     channels: ["C12345678"]
  #     keywords: ["@myname"]
  #     ignore_bots: true
  #     workspace: "myco"                # optional: overrides agent.slack.workspace
